name: evals

on:
  pull_request:
  push:
    branches: [main]
    paths: ["drafter/**", "evals/**", "data/**", "tests/**", "requirements*.txt", ".github/**"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - run: pytest -q

  evals:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - name: Start Ollama with the same model we use locally
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > ollama.log 2>&1 &
          sleep 5
          ollama pull qwen2.5:7b
      - name: Run the smoke evals
        run: python -m evals.run --suite smoke
      - name: Quality gate
        run: python -m evals.gate --suite smoke
      - name: HTML report
        if: always()
        run: python -m evals.report --suite smoke
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: eval-report
          path: reports/
