<!doctype html>
<meta charset="utf-8">
<title>Eval report $run_id</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f6f7f9;
         color: #1d2433; }
  main { max-width: 1240px; margin: 0 auto; padding: 28px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 28px 0 10px; }
  .sub { color: #667085; }
  .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 18px; }
  .card { background: #fff; border: 1px solid #e4e7ec; border-radius: 10px; padding: 14px; }
  .card b { display: block; font-size: 28px; }
  .card span { color: #667085; font-size: 13px; }
  .card em { font-style: normal; font-size: 13px; color: #12b76a; margin-left: 6px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  table { border-collapse: collapse; width: 100%; background: #fff; border: 1px solid #e4e7ec; }
  td, th { padding: 7px 10px; border-bottom: 1px solid #eef0f3; text-align: left;
           font-size: 14px; vertical-align: top; }
  .bar { height: 9px; background: #e4e7ec; border-radius: 5px; width: 200px; }
  .bar i { display: block; height: 9px; border-radius: 5px; background: #12b76a; }
  .low i { background: #f04438; }
  .fail { color: #d92d20; font-weight: 600; }
  .small { white-space: pre-wrap; font-size: 13px; color: #344054; }
</style>
<main>
  <h1>Reply drafter evals</h1>
  <div class="sub">run $run_id · $cases cases · model $model</div>
  <div class="cards">$cards</div>
  <div class="two">
    <div><h2>Checks</h2><table>$checks</table></div>
    <div><h2>Slices, weakest first</h2>
      <table><tr><th>slice</th><th>n</th><th>pass</th><th></th></tr>$slices</table></div>
  </div>
  <h2>Failing cases</h2>
  <table>
    <tr><th>case</th><th>email</th><th>reply</th><th>failed</th><th>judge says</th></tr>
    $fails
  </table>
</main>
